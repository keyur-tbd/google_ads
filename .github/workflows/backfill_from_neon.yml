name: Backfill Google Ads tables from Neon → Supabase

on:
  workflow_dispatch:
    inputs:
      tables:
        description: "Comma separated tables to copy"
        required: false
        default: "gads_campaigns,gads_asset_groups,gads_search_terms,gads_product_performance"
      overwrite:
        description: "Let Neon rows overwrite rows already in Supabase (true/false)"
        required: false
        default: "false"

jobs:
  backfill:
    name: Copy Neon tables into Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Copy tables
        env:
          NEON_DSN:        ${{ secrets.NEON_DSN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          TABLES:          ${{ github.event.inputs.tables }}
          OVERWRITE:       ${{ github.event.inputs.overwrite == 'true' && '1' || '0' }}
          SYNC_MODULE:     google_ads_sync
          # google_ads_sync imports its config at module load; these keep it happy
          GOOGLE_ADS_CUSTOMER_IDS: "0"
        run: python neon_to_supabase.py
